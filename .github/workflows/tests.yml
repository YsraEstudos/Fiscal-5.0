name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  js-unit:
    name: JS Unit + Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run JS coverage
        run: npm run test:js:coverage

      - name: Check critical JS coverage
        run: node scripts/check-js-critical-coverage.mjs

      - name: Upload JS coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: js-coverage
          path: reports/coverage/js
          if-no-files-found: warn

  python-unit:
    name: Python Unit + Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-reporting.txt coverage

      - name: Run Python coverage gate
        run: |
          python -m coverage run -m unittest discover -s tests_py -p "test_*.py"
          python -m coverage report --include=reporting_service.py --fail-under=82 -m

      - name: Save Python coverage XML
        run: python -m coverage xml -o reports/coverage/python/coverage.xml

      - name: Upload Python coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: reports/coverage/python
          if-no-files-found: warn

  e2e-local:
    name: E2E Local (Fixtures)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - js-unit
      - python-unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            reports/playwright-html
            test-results
          if-no-files-found: warn
