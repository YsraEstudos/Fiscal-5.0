            function abre(q, t) {
                var src = q.href;

                //$("#imgMidia").attr("href", src);

                $('#gallery_01 a').removeClass('active').eq(2 - 1).addClass('active');

                    /*constrainType: "height", constrainSize: 500,*/
                    zoomType: "lens",
                    containLensZoom: true, gallery: 'gallery_01',
                    cursor: 'pointer', galleryActiveClass: "active", scrollZoom: true,
                    zoomWindowWidth: 500, zoomWindowHeight: 500

                ez.refresh();

                $("#dadosImgPdf").show();
                $(document).ready(function () {
                    $('#idInfos').text(function () {
                        return t
                    });
                });
            }

                $("#ltEmbed").attr("src", p.href);
                $("#dadosImgPdf").show(); $(document).ready(function () {
                    $('#idInfos').text(function () {

                        return t
                    });
                });
